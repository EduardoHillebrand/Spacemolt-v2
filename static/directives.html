<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SpaceMolt — Diretrizes</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e37;
    --text: #e6e8ec;
    --text-dim: #8b92a3;
    --accent: #3ddc97;
    --warn: #ffb300;
    --danger: #ff5c5c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, Segoe UI, sans-serif;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.subtitle { color: var(--text-dim); margin: 0 0 20px; font-size: 13px; }
  .layout { display: grid; grid-template-columns: 1fr 2fr; gap: 16px; align-items: start; }
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
  }
  label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; text-transform: uppercase; }
  input[type="text"], input[type="password"], textarea, select {
    width: 100%;
    background: #0d0f13;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 8px 10px;
    font: inherit;
    margin-bottom: 14px;
  }
  textarea { min-height: 90px; resize: vertical; }
  button {
    background: var(--accent);
    color: #06140e;
    border: none;
    border-radius: 6px;
    padding: 10px 16px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
  button.link { background: transparent; border: none; color: var(--accent); padding: 0; font-weight: 400; text-decoration: underline; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .checkbox-row input { width: auto; margin: 0; }
  #status { font-size: 13px; margin-top: 10px; min-height: 18px; }
  #status.ok { color: var(--accent); }
  #status.err { color: var(--danger); }
  .account-list button {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    margin-bottom: 6px;
  }
  .account-list button.active { border-color: var(--accent); color: var(--accent); }
  .hidden { display: none; }
  .login-compact { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--text-dim); }
  #feed-panel {
    display: flex;
    flex-direction: column;
    height: calc(100vh - 32px);
  }
  #feed {
    flex: 1;
    overflow-y: auto;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px;
  }
  .feed-row { padding: 5px 0; border-bottom: 1px solid var(--border); }
  .feed-head { color: var(--text-dim); }
  .feed-head.info { color: var(--text-dim); }
  .feed-head.warning { color: var(--warn); }
  .feed-head.error { color: var(--danger); }
  .feed-payload { color: var(--text-dim); white-space: pre-wrap; font-size: 11px; margin-top: 2px; }
  #feed-connection { font-size: 11px; color: var(--text-dim); margin-bottom: 8px; }
</style>
</head>
<body>
  <h1>SpaceMolt — Diretrizes do operador</h1>
  <p class="subtitle">Ajuste fino por conta à esquerda; o que cada conta está fazendo agora, à direita (spec 0012).</p>

  <div class="layout">
    <div id="left-col">
      <div class="panel" id="login-panel">
        <label for="auth-user">Usuário</label>
        <input type="text" id="auth-user" autocomplete="username" />
        <label for="auth-pass">Senha</label>
        <input type="password" id="auth-pass" autocomplete="current-password" />
        <button id="login-btn">Entrar</button>
        <div id="auth-status" style="font-size:12px;color:var(--text-dim);margin-top:8px"></div>
      </div>

      <div class="panel hidden" id="login-compact-panel">
        <div class="login-compact">
          <span id="login-compact-text"></span>
          <button class="link" id="switch-login-btn" type="button">trocar</button>
        </div>
      </div>

      <div class="panel">
        <label>Contas</label>
        <div class="account-list" id="account-list">Carregando…</div>
      </div>

      <div class="panel hidden" id="directive-panel">
        <h2 id="directive-title" style="font-size:15px;margin-top:0"></h2>

        <div class="checkbox-row">
          <input type="checkbox" id="paused" />
          <label for="paused" style="margin:0">Pausada (a conta para de agir até desmarcar)</label>
        </div>

        <label for="preferred-resource">Recurso preferido na mineração (ex.: iron) — vazio = sem preferência</label>
        <input type="text" id="preferred-resource" placeholder="iron" />

        <label for="note">Nota livre (repassada ao Decider quando ele já for consultado por alguma skill)</label>
        <textarea id="note" placeholder="Ex.: foco em acumular crédito pra trocar de nave"></textarea>

        <button id="save-btn">Salvar diretriz</button>
        <button class="secondary" id="reload-btn" type="button">Recarregar</button>
        <div id="status"></div>
      </div>
    </div>

    <div id="right-col">
      <div class="panel" id="feed-panel">
        <h2 style="font-size:15px;margin:0 0 6px">Ao vivo</h2>
        <div id="feed-connection">Entre com usuário/senha pra conectar.</div>
        <div id="feed"></div>
      </div>
    </div>
  </div>

  <script>
    const state = { user: "", pass: "", accounts: [], selected: null, authenticated: false };
    const MAX_FEED_ROWS = 300;
    let liveSocket = null;

    function authHeader() {
      return "Basic " + btoa(`${state.user}:${state.pass}`);
    }

    function setStatus(el, text, kind) {
      el.textContent = text;
      el.className = kind || "";
    }

    function markAuthenticated() {
      if (state.authenticated) return;
      state.authenticated = true;
      document.getElementById("login-panel").classList.add("hidden");
      document.getElementById("login-compact-panel").classList.remove("hidden");
      document.getElementById("login-compact-text").textContent = `Conectado como ${state.user}`;
      connectLiveFeed();
    }

    function markLoggedOut() {
      state.authenticated = false;
      document.getElementById("login-panel").classList.remove("hidden");
      document.getElementById("login-compact-panel").classList.add("hidden");
      if (liveSocket) { liveSocket.close(); liveSocket = null; }
    }

    document.getElementById("login-btn").addEventListener("click", () => {
      state.user = document.getElementById("auth-user").value;
      state.pass = document.getElementById("auth-pass").value;
      setStatus(document.getElementById("auth-status"), state.user ? "Tentando…" : "", "ok");
      // Confirmação real de que a credencial vale vem do primeiro pedido autenticado que
      // der certo (seleção de conta ou carregamento do feed) -- não existe um endpoint só
      // de "login" nesta API, é tudo HTTP Basic por pedido.
      const active = document.querySelector(".account-list button.active");
      if (active) selectAccount(state.selected, active);
    });

    document.getElementById("switch-login-btn").addEventListener("click", markLoggedOut);

    function connectLiveFeed() {
      if (!state.user || !state.pass) return;
      if (liveSocket && (liveSocket.readyState === WebSocket.OPEN || liveSocket.readyState === WebSocket.CONNECTING)) return;

      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      const url = `${proto}//${location.host}/live?user=${encodeURIComponent(state.user)}&pass=${encodeURIComponent(state.pass)}`;
      const connEl = document.getElementById("feed-connection");
      liveSocket = new WebSocket(url);

      liveSocket.addEventListener("open", () => setStatus(connEl, "Conectado.", "ok"));
      liveSocket.addEventListener("message", (ev) => {
        try { appendFeedEvent(JSON.parse(ev.data)); } catch {}
      });
      liveSocket.addEventListener("close", () => {
        setStatus(connEl, "Desconectado — tentando de novo…", "err");
        if (state.authenticated) setTimeout(connectLiveFeed, 3000);
      });
      liveSocket.addEventListener("error", () => {});
    }

    function appendFeedEvent(event) {
      const feed = document.getElementById("feed");
      const row = document.createElement("div");
      row.className = "feed-row";

      const head = document.createElement("div");
      head.className = `feed-head ${event.level || "info"}`;
      const time = event.timestamp ? new Date(event.timestamp).toLocaleTimeString() : "";
      head.textContent = `${time} [${event.account || "?"}] ${event.type || "?"}`;
      row.appendChild(head);

      if (event.payload !== undefined) {
        const pre = document.createElement("div");
        pre.className = "feed-payload";
        pre.textContent = JSON.stringify(event.payload);
        row.appendChild(pre);
      }

      feed.appendChild(row);
      while (feed.childElementCount > MAX_FEED_ROWS) feed.removeChild(feed.firstChild);
      feed.scrollTop = feed.scrollHeight;
    }

    async function loadAccounts() {
      const resp = await fetch("/api/accounts");
      state.accounts = await resp.json();
      const list = document.getElementById("account-list");
      list.innerHTML = "";
      for (const acc of state.accounts) {
        const btn = document.createElement("button");
        btn.textContent = `${acc.name} — ${acc.role}`;
        btn.addEventListener("click", () => selectAccount(acc.name, btn));
        list.appendChild(btn);
      }
    }

    async function selectAccount(name, btnEl) {
      document.querySelectorAll(".account-list button").forEach((b) => b.classList.remove("active"));
      if (btnEl) btnEl.classList.add("active");
      state.selected = name;

      const resp = await fetch(`/api/directive/${name}`, { headers: { Authorization: authHeader() } });
      const panel = document.getElementById("directive-panel");
      const status = document.getElementById("status");

      if (resp.status === 401) {
        panel.classList.add("hidden");
        markLoggedOut();
        setStatus(document.getElementById("auth-status"), "Credenciais inválidas.", "err");
        return;
      }
      if (!resp.ok) {
        panel.classList.add("hidden");
        setStatus(status, `Erro ao carregar diretriz (${resp.status}).`, "err");
        return;
      }

      markAuthenticated();
      const directive = await resp.json();
      document.getElementById("directive-title").textContent = `Diretriz — ${name}`;
      document.getElementById("paused").checked = !!directive.paused;
      document.getElementById("preferred-resource").value = (directive.preferences && directive.preferences.mining && directive.preferences.mining.preferredResource) || "";
      document.getElementById("note").value = directive.note || "";
      panel.classList.remove("hidden");
      setStatus(status, "Carregada.", "ok");
    }

    document.getElementById("save-btn").addEventListener("click", async () => {
      if (!state.selected) return;
      const status = document.getElementById("status");
      const preferredResource = document.getElementById("preferred-resource").value.trim();

      const patch = {
        paused: document.getElementById("paused").checked,
        note: document.getElementById("note").value,
        preferences: { mining: preferredResource ? { preferredResource } : {} },
      };

      const resp = await fetch(`/api/directive/${state.selected}`, {
        method: "POST",
        headers: { Authorization: authHeader(), "Content-Type": "application/json" },
        body: JSON.stringify(patch),
      });

      if (resp.status === 401) {
        markLoggedOut();
        setStatus(status, "Credenciais inválidas — não salvou nada.", "err");
        return;
      }
      if (!resp.ok) {
        setStatus(status, `Erro ao salvar (${resp.status}).`, "err");
        return;
      }
      setStatus(status, "Salvo — efeito no próximo ciclo da conta.", "ok");
    });

    document.getElementById("reload-btn").addEventListener("click", () => {
      const active = document.querySelector(".account-list button.active");
      if (active && state.selected) selectAccount(state.selected, active);
    });

    loadAccounts();
  </script>
</body>
</html>
